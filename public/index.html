<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マルチペルソナ会議シミュレーター</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .input-section {
            margin-bottom: 25px;
        }

        .input-section label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 1.05em;
        }

        .input-section textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
            transition: border-color 0.3s;
        }

        .input-section textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-section input[type="number"] {
            width: 100px;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
        }

        .hint {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
            min-width: 200px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }


        .btn-secondary {
            background: linear-gradient(135deg, #e0e7ff 0%, #b4aeea 100%);
            color: #4b3ca7;
            font-weight: 600;
            border: 2px solid #b4aeea;
            box-shadow: 0 2px 8px rgba(180, 174, 234, 0.2);
            transition: background 0.3s, box-shadow 0.3s;
        }

        .btn-secondary:hover {
            background: linear-gradient(135deg, #b4aeea 0%, #667eea 100%);
            color: #fff;
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.3);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .conversation {
            display: none;
        }

        .conversation.active {
            display: block;
        }

        .message {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #f9f9f9;
            border-left: 4px solid #667eea;
        }

        .message.facilitator {
            background: #e8eaf6;
            border-left-color: #3f51b5;
        }

        .message.optimist {
            background: #e8f5e9;
            border-left-color: #4caf50;
        }

        .message.realist {
            background: #fff3e0;
            border-left-color: #ff9800;
        }

        .message.customer {
            background: #fce4ec;
            border-left-color: #e91e63;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .persona-name {
            font-weight: 600;
            font-size: 1.05em;
            color: #333;
        }

        .timestamp {
            font-size: 0.85em;
            color: #999;
        }

        .message-content {
            line-height: 1.6;
            color: #444;
        }

        .summary-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .summary-box h3 {
            margin-bottom: 10px;
        }

        .personas-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .persona-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }

        .persona-card h4 {
            margin-bottom: 5px;
            font-size: 1em;
        }

        .persona-card p {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .refined-theme {
            background: #fff9c4;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #fbc02d;
        }

        .refined-theme strong {
            display: block;
            margin-bottom: 5px;
            color: #f57f17;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.5em;
            }

            .card {
                padding: 20px;
            }

            .button-group {
                flex-direction: column;
            }

            .btn-primary {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎭 マルチペルソナ会議シミュレーター</h1>
            <p>異なる視点を持つAIペルソナが、あなたのテーマについて議論します</p>
        </div>

        <div class="card">
            <div class="personas-info">
                <div class="persona-card">
                    <h4>🎯 ファシリテーター</h4>
                    <p>議論を整理し進行を管理</p>
                </div>
                <div class="persona-card">
                    <h4>📈 楽観的マーケター</h4>
                    <p>機会と可能性を探る</p>
                </div>
                <div class="persona-card">
                    <h4>⚙️ 慎重なエンジニア</h4>
                    <p>リスクと実現性を分析</p>
                </div>
                <div class="persona-card">
                    <h4>👤 ユーザー代表</h4>
                    <p>使い手の視点で評価</p>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="input-section">
                <label for="theme">議論したいテーマ</label>
                <textarea 
                    id="theme" 
                    placeholder="何について議論してほしいですか？自由に入力してください"
                ></textarea>
                <p class="hint">💡 ビジネス、製品開発、戦略、課題解決など、どんなテーマでもOKです</p>
                    <button id="refineBtn" class="btn-secondary" style="margin-top:10px;">✨ テーマを具体化する</button>
            </div>

            <div class="input-section">
                <label for="turns">議論のターン数（1-5）</label>
                <input type="number" id="turns" value="3" min="1" max="5">
                <p class="hint">各ペルソナが発言する回数。多いほど深い議論になります</p>
            </div>

                <div class="button-group">
                    <button id="generateBtn" class="btn-primary">🚀 会議を開始</button>
                </div>

            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>AIペルソナが議論中...</p>
            </div>
        </div>

        <div id="conversation" class="conversation">
            <div class="card">
                <div id="refinedThemeBox"></div>
                <h2 style="margin-bottom: 20px;">💬 議論の内容</h2>
                <div id="messages"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
